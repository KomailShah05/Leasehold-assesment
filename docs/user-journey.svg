<svg width="680" height="424" viewBox="0 0 680 424" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>User journey through the leasehold triage prototype</title>
  <desc>Four sequential steps: describe issue or choose scenario, answer one or two questions, see a clear safe next step, read approved guidance.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <style>
    .box { fill: #E1F5EE; stroke: #0F6E56; stroke-width: 0.5; }
    .th { font-family: sans-serif; font-size: 14px; font-weight: 500; fill: #085041; }
    .ts { font-family: sans-serif; font-size: 12px; fill: #0F6E56; }
    .arr { stroke: #5F5E5A; stroke-width: 1; }
  </style>
  <rect class="box" x="210" y="40" width="260" height="56" rx="8"/>
  <text class="th" x="340" y="60" text-anchor="middle" dominant-baseline="central">Describe issue</text>
  <text class="ts" x="340" y="80" text-anchor="middle" dominant-baseline="central">or choose a scenario</text>
  <line x1="340" y1="96" x2="340" y2="132" class="arr" marker-end="url(#arrow)"/>
  <rect class="box" x="210" y="136" width="260" height="56" rx="8"/>
  <text class="th" x="340" y="156" text-anchor="middle" dominant-baseline="central">Answer questions</text>
  <text class="ts" x="340" y="176" text-anchor="middle" dominant-baseline="central">one or two, tailored</text>
  <line x1="340" y1="192" x2="340" y2="228" class="arr" marker-end="url(#arrow)"/>
  <rect class="box" x="210" y="232" width="260" height="56" rx="8"/>
  <text class="th" x="340" y="252" text-anchor="middle" dominant-baseline="central">See next step</text>
  <text class="ts" x="340" y="272" text-anchor="middle" dominant-baseline="central">clear and safe</text>
  <line x1="340" y1="288" x2="340" y2="324" class="arr" marker-end="url(#arrow)"/>
  <rect class="box" x="210" y="328" width="260" height="56" rx="8"/>
  <text class="th" x="340" y="348" text-anchor="middle" dominant-baseline="central">Read guidance</text>
  <text class="ts" x="340" y="368" text-anchor="middle" dominant-baseline="central">approved LEASE content</text>
</svg>
