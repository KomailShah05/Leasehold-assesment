<svg width="680" height="396" viewBox="0 0 680 396" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>System architecture for the leasehold triage prototype</title>
  <desc>React user interface calls the Django triage API, which reads route and question data plus Wagtail guidance, and merges them into a single safe next-step response.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#185FA5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <style>
    .blue { fill: #E6F1FB; stroke: #185FA5; stroke-width: 0.5; }
    .teal { fill: #E1F5EE; stroke: #0F6E56; stroke-width: 0.5; }
    .coral { fill: #FAECE7; stroke: #993C1D; stroke-width: 0.5; }
    .gray { fill: #F1EFE8; stroke: #5F5E5A; stroke-width: 0.5; }
    .th-blue { font-family: sans-serif; font-size: 14px; font-weight: 500; fill: #0C447C; }
    .th-teal { font-family: sans-serif; font-size: 14px; font-weight: 500; fill: #085041; }
    .ts-teal { font-family: sans-serif; font-size: 12px; fill: #0F6E56; }
    .th-coral { font-family: sans-serif; font-size: 14px; font-weight: 500; fill: #712B13; }
    .ts-coral { font-family: sans-serif; font-size: 12px; fill: #993C1D; }
    .th-gray { font-family: sans-serif; font-size: 14px; font-weight: 500; fill: #444441; }
    .arr { stroke: #185FA5; stroke-width: 1; fill: none; }
  </style>
  <rect class="blue" x="220" y="40" width="240" height="44" rx="8"/>
  <text class="th-blue" x="340" y="62" text-anchor="middle" dominant-baseline="central">React user interface</text>
  <line x1="340" y1="84" x2="340" y2="120" class="arr" marker-end="url(#arrow)"/>
  <rect class="blue" x="220" y="124" width="240" height="44" rx="8"/>
  <text class="th-blue" x="340" y="146" text-anchor="middle" dominant-baseline="central">Django triage API</text>
  <path d="M340 168V190H250V208" class="arr" marker-end="url(#arrow)"/>
  <path d="M340 168V190H490V208" class="arr" marker-end="url(#arrow)"/>
  <rect class="teal" x="140" y="212" width="220" height="56" rx="8"/>
  <text class="th-teal" x="250" y="232" text-anchor="middle" dominant-baseline="central">Route and question</text>
  <text class="ts-teal" x="250" y="252" text-anchor="middle" dominant-baseline="central">data</text>
  <rect class="coral" x="380" y="212" width="220" height="56" rx="8"/>
  <text class="th-coral" x="490" y="232" text-anchor="middle" dominant-baseline="central">Wagtail guidance</text>
  <text class="ts-coral" x="490" y="252" text-anchor="middle" dominant-baseline="central">approved content</text>
  <path d="M250 268V292H340V320" class="arr" marker-end="url(#arrow)"/>
  <path d="M490 268V292H340V320" class="arr" marker-end="url(#arrow)"/>
  <rect class="gray" x="190" y="324" width="300" height="44" rx="8"/>
  <text class="th-gray" x="340" y="346" text-anchor="middle" dominant-baseline="central">Safe next-step response</text>
</svg>
